name: First Fonts GitHub trigger preparation — source only
on:
  push:
    branches: [review/first-fonts-github-preparation-20261104]
  pull_request:
    paths:
      - 'project/graphics-first-workspace/first-fonts-github-preparation-v1.json'
      - 'tools/verify_first_fonts_github_preparation.py'
      - 'tests/test_first_fonts_github_preparation.py'
      - 'tests/test_first_fonts_issue_opened.py'
      - '.github/workflows/verify-first-fonts-github-preparation.yml'
permissions:
  contents: read
jobs:
  exact-no-dispatch-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: 1f07e83dbd80dacb9bed0d6494c697375f0e26cd
          path: dependencies/image-build-source
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-deploy
          ref: 4956d926b56def821e6a57025b803ef21f2ca330
          path: dependencies/host-deploy-pr7
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-deploy
          ref: e3bc72f49391b99c96d5b9a44f99d6659bc31c59
          path: dependencies/host-deploy-taskc
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: 1616f192ef9d8964a8f37f32a86c69c0242a213c
          path: dependencies/image-build-signed-reader
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-deploy
          ref: b3ac93cd92df1b280f087fbb748263d3371750aa
          path: dependencies/host-deploy-compiler-consumer-pr29
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/image-build
          ref: 40b6e88a005298924a9369f3c1131efcae36c67d
          path: dependencies/image-build-compiler-runtime
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/build-record
          ref: a866c9c4b0dd385045f00ce2de7d809f5b67c104
          path: dependencies/build-record
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install synthetic test dependency only
        run: python -m pip install 'pytest==8.4.2'
      - name: Verify immutable checkout identities
        run: |
          test "$(git -C dependencies/image-build-source rev-parse HEAD)" = "1f07e83dbd80dacb9bed0d6494c697375f0e26cd"
          test "$(git -C dependencies/host-deploy-pr7 rev-parse HEAD)" = "4956d926b56def821e6a57025b803ef21f2ca330"
          test "$(git -C dependencies/host-deploy-taskc rev-parse HEAD)" = "e3bc72f49391b99c96d5b9a44f99d6659bc31c59"
          test "$(git -C dependencies/image-build-signed-reader rev-parse HEAD)" = "1616f192ef9d8964a8f37f32a86c69c0242a213c"
          test "$(git -C dependencies/host-deploy-compiler-consumer-pr29 rev-parse HEAD)" = "b3ac93cd92df1b280f087fbb748263d3371750aa"
          test "$(git -C dependencies/image-build-compiler-runtime rev-parse HEAD)" = "40b6e88a005298924a9369f3c1131efcae36c67d"
          test "$(git -C dependencies/build-record rev-parse HEAD)" = "a866c9c4b0dd385045f00ce2de7d809f5b67c104"
      - name: Exact Fonts catalogue, October source and non-submittable request validation
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          ZOG_HOSTDEPLOY_FONTS_PR7: dependencies/host-deploy-pr7
          ZOG_HOSTDEPLOY_TASKC_PR26: dependencies/host-deploy-taskc
          ZOG_IMAGE_BUILD_SELECTED_SOURCE: dependencies/image-build-source
          ZOG_IMAGE_BUILD_SIGNED_READER: dependencies/image-build-signed-reader
          ZOG_HOSTDEPLOY_COMPILER_CONSUMER_PR29: dependencies/host-deploy-compiler-consumer-pr29
          ZOG_IMAGE_BUILD_COMPILER_RUNTIME: dependencies/image-build-compiler-runtime
          ZOG_BUILD_RECORD_COMPANION: dependencies/build-record
        run: |
          python -m compileall -q tools/verify_first_fonts_github_preparation.py tests/test_first_fonts_github_preparation.py
          python tools/verify_first_fonts_github_preparation.py \
            --fonts-host "$ZOG_HOSTDEPLOY_FONTS_PR7" \
            --taskc-host "$ZOG_HOSTDEPLOY_TASKC_PR26" \
            --image-build-source "$ZOG_IMAGE_BUILD_SELECTED_SOURCE" \
            --signed-reader "$ZOG_IMAGE_BUILD_SIGNED_READER" \
            --compiler-consumer "$ZOG_HOSTDEPLOY_COMPILER_CONSUMER_PR29" \
            --compiler-runtime "$ZOG_IMAGE_BUILD_COMPILER_RUNTIME" \
            --build-record-source "$ZOG_BUILD_RECORD_COMPANION"
          python -m pytest -q tests/test_first_fonts_github_preparation.py tests/test_first_fonts_issue_opened.py
      - name: Source only, zero execution authority
        if: always()
        run: |
          echo 'No GitHub execution issue created; no SQS, SSM, AWS credentials, build, or generation admitted.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The actual issues.opened workflow belongs to host-deploy; this source CI only simulates its event and FIFO message.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PR7 installed catalogue, protected Task C owner and native managed Host remain NO-GO.' >> "$GITHUB_STEP_SUMMARY"
