name: LLVM TableGen output source gate (never native)
on:
  push:
    branches: [regular/mesa-first-workspace-software-gl]
    paths:
      - 'project/graphics-drafts/llvm/stages/final/**'
      - 'project/graphics-drafts/mesa/stages/final/**'
      - 'project/graphics-drafts/rights-admission-evidence.json'
      - 'tools/verify_llvm_tblgen_source.py'
      - 'tests/test_llvm_tblgen_source.py'
      - 'tests/test_mesa_software_recipes.py'
      - 'docs/image-build/llvm-tablegen-selected-output-source-review-2026-11-03.md'
      - '.github/workflows/verify-llvm-tblgen-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify required LLVM TableGen and Mesa source preflight
        run: python tools/verify_llvm_tblgen_source.py
      - name: Exercise missing tool, provenance and original rights negatives
        run: |
          python -m pip install 'pytest==8.4.2'
          python -m pytest -q tests/test_llvm_tblgen_source.py tests/test_mesa_software_recipes.py tests/test_mesa_python_build_closure.py
      - name: No compiler or installation authority
        if: always()
        run: echo 'Source only, no LLVM build, accepted generation, original rights approval or native submission.' >> "$GITHUB_STEP_SUMMARY"
