name: Fonts accepted kind=image compiler input (source-only)
on:
  push:
    branches: [regular/fonts-accept-image-compiler-input-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accepted-image-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install source-test harness
        run: python -m pip install 'pytest>=8,<10'
      - name: Test explicit image-compiler selection, nonmutation, and ordinary build outputs
        run: |
          python -m compileall -q src/zog/image_build/engine.py src/zog/image_build/remote_operations.py tests/test_remote_operations.py
          PYTHONPATH=src python -m pytest -q -p no:cacheprovider tests/test_remote_operations.py \
            -k 'not test_remote_cli_pipeline_inspect_uses_explicit_real_monthly_pin and not test_remote_cli_external_pipeline_inspect_needs_no_controller'
      - name: Read-only acceptance boundary
        if: always()
        run: echo 'No original compiler Project, generation, signed acceptance receipt, Fonts build, gateway or new native output touched.' >> "$GITHUB_STEP_SUMMARY"
