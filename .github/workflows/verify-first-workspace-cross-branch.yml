name: Verify frozen Workspace and Mesa draft source intersection
on:
  pull_request:
    branches: [main, unstable]
  push:
    branches: [regular/graphics-xvnc-source-closure-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  held-cross-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Reject source authority escalation
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q -p no:cacheprovider tests/test_first_workspace_cross_branch.py tests/test_first_workspace_full_source_order.py tests/test_workspace_native_handoff.py
      - name: Refuse invented accepted generation receipts
        run: python tools/verify_workspace_native_handoff.py
      - name: Reopen immutable Mesa draft source policy at its exact Git revision
        run: python tools/verify_first_workspace_source_branches.py
# Read-only HEAD-bound metadata checks, no native compilation, release,
# rights authorization, host credentials or PR merging.
