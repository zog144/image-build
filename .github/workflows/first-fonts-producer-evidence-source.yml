name: First Fonts producer evidence source (no compiler)
on:
  push:
    branches: [review/first-fonts-producer-evidence-20261104]
  pull_request:
    paths:
      - 'src/zog/image_build/first_fonts_producer_contract.py'
      - 'tests/test_first_fonts_producer_contract.py'
      - 'tests/test_compiler_base_acceptance.py'
      - 'tests/test_compiler_base_probe_execution.py'
      - 'tests/test_compiler_base_pipeline.py'
      - 'src/zog/image_build/compiler_base_acceptance.py'
      - 'src/zog/image_build/compiler_base_probe.py'
      - 'src/zog/image_build/pipeline.py'
      - 'src/zog/image_build/engine.py'
      - 'src/zog/image_build/remote_operations.py'
      - 'src/zog/image_build/graphical_composition.py'
      - 'src/zog/image_build/graphical_generation_acceptance.py'
      - '.github/workflows/first-fonts-producer-evidence-source.yml'
      - 'docs/image-build/first-fonts-producer-evidence-consumer-handoff-2026-11-04.md'
permissions:
  contents: read
jobs:
  canonical-read-only-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12','3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Ensure original selected source is retained, not independently repinned
        run: |
          git merge-base --is-ancestor 1f07e83dbd80dacb9bed0d6494c697375f0e26cd HEAD
          test -f src/zog/image_build/graphical_generation_acceptance.py
          test -f project/bootstrap/graphics-fonts.py
      - name: Install synthetic source-test and canonical build-record dependencies
        run: |
          python -m pip install 'pytest==8.4.2' 'cryptography==46.0.3'
          python -m pip install 'build-record @ git+https://github.com/zog144/build-record.git@a866c9c4b0dd385045f00ce2de7d809f5b67c104'
      - name: Test exact source manifest, missing accepted stage-2 and output producer reader
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/zog/image_build/first_fonts_producer_contract.py tests/test_first_fonts_producer_contract.py
          python -m pytest -q -p no:cacheprovider tests/test_first_fonts_producer_contract.py tests/test_compiler_base_acceptance.py tests/test_compiler_base_probe_execution.py tests/test_compiler_base_pipeline.py tests/test_graphical_generation_acceptance.py tests/test_graphical_composition.py tests/test_remote_gateway_readiness.py
      - name: Admit neither native Host nor request
        if: always()
        run: |
          echo 'Only original source and synthetic canonical records were checked.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No accepted stage-2 generation selected, no native Host installed, no Task C owner, no catalogue or GitHub issue/SQS/SSM/compiler.' >> "$GITHUB_STEP_SUMMARY"
