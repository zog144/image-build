name: Inspect original Mesa component rights questions
on:
  pull_request:
    branches: [main, unstable]
  push:
    branches: [regular/mesa-first-workspace-software-gl]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [llvm, mesa, libdrm, mesa-demos]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest -q -p no:cacheprovider tests/test_mesa_original_rights_questions.py
      - run: python tools/inspect_mesa_original_rights_questions.py --package ${{ matrix.package }}
# An archive inspection is NOT a source/object build trace or legal approval.
