name: Inspect original xterm X11 font prerequisites
on:
  push:
    branches: [regular/graphics-xvnc-source-closure-20261102]
  pull_request:
    branches: [main, unstable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archives:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        name: [libXaw, libXmu, libXpm, libXft, luit, font-misc-misc, bdftopcf, mkfontscale, xkbcomp]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python tools/inspect_xterm_predecessor_archives.py --package ${{ matrix.name }}
      - name: Validate xterm source widgets and font stages
        run: |
          python -m pip install pytest==8.4.2
          PYTHONPATH=src python -m pytest -q -p no:cacheprovider tests/test_xterm_font_widgets.py tests/test_xterm_luit_bdftopcf.py
# Read-only original archive-member provenance; not compiled tool or rights approval.
