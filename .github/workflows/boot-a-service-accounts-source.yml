name: Boot A account-aware producer source checks
on:
  push:
    branches: [regular/boot-a-getty-core-service-identities-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resident-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-install
          ref: 4fcccb441fec851530c412f619bc02699b8a87b1
          path: companions/host-install-resident-accounts
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Confirm exact reviewed source and root-owned systemd-sysusers
        run: |
          test "$(git -C companions/host-install-resident-accounts rev-parse HEAD)" = 4fcccb441fec851530c412f619bc02699b8a87b1
          test "$(git hash-object companions/host-install-resident-accounts/src/zog/host_install/resident_accounts.py)" = de9a161913959780a3097266d8936e0f7a1391b7
          test -x /usr/bin/systemd-sysusers
      - name: Run real disposable-root and retained targeted producer tests
        env:
          REQUIRE_HOST_INSTALL_ACCOUNTS: "1"
        run: |
          python -m pip install 'pytest==8.4.2'
          python -m pip install "build-record @ git+https://github.com/zog144/build-record.git@a866c9c4b0dd385045f00ce2de7d809f5b67c104"
          python -m pytest -q -rs \
            tests/test_resident_boot_accounts.py \
            tests/test_resident_boot_targeted.py \
            tests/test_boot_a_getty_service_accounts.py \
            tests/test_targeted_publication_binding.py \
            tests/test_staging_durability.py
      - name: No publication or host identity mutation
        if: always()
        run: echo "Source-only tests run systemd-sysusers against disposable temporary rootfs, never / or a sealed published generation." >> "$GITHUB_STEP_SUMMARY"
