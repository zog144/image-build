name: Boot A account-aware producer source checks
on:
  push:
    branches: [regular/boot-a-getty-core-service-identities-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resident-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/host-install
          ref: 4fcccb441fec851530c412f619bc02699b8a87b1
          path: companions/host-install-resident-accounts
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/box-control
          ref: c886e7a90bb4ea74e771a6c5dcefaa2069539ec7
          path: companions/box-control-inherited
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/root-control
          ref: d9dfd6c02a5a96750f1213bf663cdceab72f1efd
          path: companions/root-control-inherited
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Confirm exact reviewed source and root-owned systemd-sysusers
        run: |
          test "$(git -C companions/host-install-resident-accounts rev-parse HEAD)" = 4fcccb441fec851530c412f619bc02699b8a87b1
          test "$(git hash-object companions/host-install-resident-accounts/src/zog/host_install/resident_accounts.py)" = de9a161913959780a3097266d8936e0f7a1391b7
          test -x /usr/bin/systemd-sysusers
          test "$(git -C companions/box-control-inherited rev-parse HEAD)" = c886e7a90bb4ea74e771a6c5dcefaa2069539ec7
          test "$(git -C companions/root-control-inherited rev-parse HEAD)" = d9dfd6c02a5a96750f1213bf663cdceab72f1efd
          test "$(git hash-object companions/box-control-inherited/box-control/src/zog/box_control/build_protocol.py)" = a334aec4865eaad003f9e02b638b5260c352b8ab
          test "$(git hash-object companions/root-control-inherited/src/zog/root_control/build.py)" = 33303c38d4cc8e13b742cac1510dc52c4544f2f9
      - name: Run real disposable-root and retained targeted producer tests
        env:
          REQUIRE_HOST_INSTALL_ACCOUNTS: "1"
        run: |
          python -m pip install 'pytest==8.4.2'
          python -m pip install "build-record @ git+https://github.com/zog144/build-record.git@a866c9c4b0dd385045f00ce2de7d809f5b67c104"
          python -m pytest -q -rs \
            tests/test_resident_boot_accounts.py \
            tests/test_resident_boot_targeted.py \
            tests/test_boot_a_getty_service_accounts.py \
            tests/test_targeted_publication_binding.py \
            tests/test_staging_durability.py
      - name: Verify Boot A and combined controllers agree on identity-free build requests
        env:
          REQUIRE_INHERITED_BUILD_PROTOCOL: "1"
        run: |
          python -m pip install "dbus-next==0.2.3"
          PYTHONPATH="$PWD/src:$PWD/companions/box-control-inherited/box-control/src:$PWD/companions/root-control-inherited/src" \
            python -m pytest -q -rs \
              tests/test_boot_a_finite_build_identity.py \
              tests/test_source_build.py
      - name: No publication or host identity mutation
        if: always()
        run: echo "Source-only tests run systemd-sysusers against disposable temporary rootfs, never / or a sealed published generation." >> "$GITHUB_STEP_SUMMARY"
