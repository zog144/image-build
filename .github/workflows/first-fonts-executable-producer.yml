name: First Fonts runnable stages — normal producer prepare-only
on:
  push:
    branches: [regular/first-fonts-executable-stage-selection-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-fonts-stages:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Source-only runner and pinned source-provenance requirements
        run: |
          python -m pip install "pytest==8.4.2"
          python -m pip install "build-record @ git+https://github.com/zog144/build-record.git@a866c9c4b0dd385045f00ce2de7d809f5b67c104"
      - name: Prove real fonts stage source hashes, notice manifests and normal producer selection without compiling
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/zog/image_build/first_fonts.py src/zog/image_build/remote_operations.py
          python -m pytest -q -rs -p no:cacheprovider \
            tests/test_first_fonts_executable_pipeline.py \
            tests/test_first_fonts_inherited_producer.py \
            tests/test_catalogue.py
      - name: Demonstrate old generic source-only Project-current input support remains
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q -rs -p no:cacheprovider tests/test_remote_operations.py \
            -k 'test_image_submit_snapshots_current_project_packages_without_preselected_digest or test_missing_project_package_fails_normally_without_gateway_gate or test_current_project_pin_update_is_copied_into_next_pipeline or test_existing_image_generation_is_usable_as_project_compiler_default or test_explicit_producer_arguments_remain_supported'
      - name: No compiler action or historical request replay
        if: always()
        run: |
          echo "All Fonts tests are Project-local prepare-only source/metadata checks. No native compiler command, protected lane, historical request or immutable generation was modified." >> "$GITHUB_STEP_SUMMARY"
