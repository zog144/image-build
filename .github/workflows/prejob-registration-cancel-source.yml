name: Pre-job registration cancellation proof (source-only)
on:
  push:
    branches: [regular/prejob-registration-cancel-proof-20261128]
  pull_request:
    branches: [regular/boot-a-inherited-peer-v2-successor-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-job-cancel-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/box-control
          ref: b5903779e72ea852a125a268dcd35189339dc4ae
          path: companions/box-control
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: zog144/root-control
          ref: 35fc1ea8969c97a00cdb4b3c18ecb47bf1f83bbb
          path: companions/root-control
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Run targeted failed-registration cancellation and full inherited-peer source regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/companions/box-control/box-control/src:${{ github.workspace }}/companions/root-control/src
        run: |
          python -m pip install 'pytest==8.4.2' 'dbus-next==0.2.3'
          python -m pytest -q -rs tests/test_boot_a_inherited_peer_v2.py
      - name: No native execution or historical replay
        if: always()
        run: |
          echo 'Disposable source fixtures only. No Fonts request 63 replay, no SSM or Host action, no manual deletion of controller state, no native child acceptance.' >> "$GITHUB_STEP_SUMMARY"
