name: Inspect first VNC Pixman and TurboJPEG source archives
on:
  push:
    branches: [regular/graphics-xvnc-source-closure-20261102]
  pull_request:
    branches: [main, unstable]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        name: [pixman, libjpeg-turbo, turbovnc]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python tools/inspect_vnc_dependency_archives.py --package ${{ matrix.name }}
      - name: Run noncanonical Pixman and TurboJPEG recipe parser tests
        run: |
          python -m pip install pytest==8.4.2
          PYTHONPATH=src python -m pytest -q -p no:cacheprovider tests/test_vnc_source_prerequisites.py tests/test_turbovnc_server_draft.py
# Pure public source inspection only; no native builds or release approval.
