name: Image-build Project default selection (source only)
on:
  push:
    branches: [regular/fonts-project-input-defaults-20261116]
  pull_request:
    paths:
      - src/zog/image_build/remote_operations.py
      - tests/test_remote_operations.py
      - .github/workflows/fonts-project-defaults.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  producer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10'
      - name: Source-only remote operations tests
        run: |
          python -m compileall -q src/zog/image_build/remote_operations.py
          # Two legacy CLI fixtures require the historical October pin, which
          # is intentionally not installed in this public executable checkout.
          PYTHONPATH=src python -m pytest -q -p no:cacheprovider tests/test_remote_operations.py \
            -k 'not test_remote_cli_pipeline_inspect_uses_explicit_real_monthly_pin and not test_remote_cli_external_pipeline_inspect_needs_no_controller'
      - name: No real producer execution
        if: always()
        run: |
          echo "Source-only tests; no real compiler or remote submit" >> "$GITHUB_STEP_SUMMARY"
