name: Project-current single-pass generation integrity
on:
  push:
    branches: [regular/single-pass-selected-generation-20261124]
  pull_request:
    paths:
      - src/zog/image_build/pipeline.py
      - src/zog/image_build/engine.py
      - src/zog/image_build/remote_operations.py
      - tests/test_remote_operations.py
      - .github/workflows/single-pass-generation-selection.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generation-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest==8.4.2"
      - name: Compile changed modules
        run: python -m compileall -q src/zog/image_build/engine.py src/zog/image_build/pipeline.py src/zog/image_build/remote_operations.py
      - name: Focused root-integrity and durable recovery regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q -rs -p no:cacheprovider tests/test_remote_operations.py \
            -k 'test_project_current_submit_inventories_selected_root_once or test_project_current_corruption_blocks_first_command or test_pending_project_current_resumes_with_full_scan_and_stable_id or test_remote_submit_persists_pipeline_identity_before_pending_return or test_image_submit_snapshots_current_project_packages_without_preselected_digest or test_existing_image_generation_is_usable_as_project_compiler_default or test_explicit_producer_arguments_remain_supported'
      - name: Preparation and resume remain source-only
        if: always()
        run: |
          echo "Synthetic Project tests only; no native root generation or controller operation touched." >> "$GITHUB_STEP_SUMMARY"
